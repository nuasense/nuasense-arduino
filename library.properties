sentence=IoT weather station and soil moisture library for ESP32 and ESP8266: NuaSense turns your sensors' readings into frost, irrigation and crop disease risk answers.
paragraph=For DIY weather stations and for garden, farm, greenhouse, beehive and storage monitoring. One add() per value, one send() per upload, over HTTPS with the certificate checked. In return: a data quality check for every sensor, frost tonight, spray windows, irrigation need and crop disease risk for your location. Works with any sensor you can read, for example BME280, DHT22, SHT31 or a capacitive soil moisture probe.
